<ion-header class="wolf-header">
  <ion-toolbar>
    <span slot="start" class="brand-mark" aria-hidden="true">
      <ion-icon name="moon-outline"></ion-icon>
    </span>
    <ion-title>
      <span class="brand-name">UMBRA</span>
      <span class="brand-divider"> / </span>
      <span class="brand-edition">GALERÍA DE CAMPO</span>
    </ion-title>
    <span slot="end" class="header-folio">EXPEDIENTE <strong>003</strong></span>
  </ion-toolbar>
</ion-header>

<ion-content class="wolf-content">
  <main class="page-shell gallery-page">
    <p class="page-kicker"><span class="kicker-line"></span> NO MIRES DEMASIADO TIEMPO</p>

    <section class="gallery-heading">
      <div>
        <p class="section-label">EVIDENCIAS RECUPERADAS</p>
        <h1>Visto antes<br />del amanecer.</h1>
      </div>
      <p>Cuatro imágenes. Ninguna explicación tranquilizadora. La última fue tomada demasiado cerca.</p>
    </section>

    <section class="gallery-grid" aria-label="Galería del hombre lobo">
      <figure class="evidence evidence--wide">
        <img src="assets/img/hl3.jpg" alt="El rostro de un hombre lobo de ojos rojos" loading="lazy" />
        <figcaption><span>PRUEBA 01</span> CONTACTO VISUAL</figcaption>
      </figure>

      <figure class="evidence">
        <img src="assets/img/hl.jpg" alt="Silueta de un hombre lobo sobre una luna llena" loading="lazy" />
        <figcaption><span>PRUEBA 02</span> EL AULLIDO</figcaption>
      </figure>

      <figure class="evidence">
        <img src="assets/img/hl1.jpg" alt="Ilustración de un hombre lobo corriendo entre sombras" loading="lazy" />
        <figcaption><span>PRUEBA 03</span> LA HUIDA</figcaption>
      </figure>

      <figure class="evidence evidence--portrait">
        <img src="assets/img/hl2.jpg" alt="Ilustración de un licántropo de ojos rojos en la oscuridad" loading="lazy" />
        <figcaption><span>PRUEBA 04</span> DEMASIADO TARDE</figcaption>
      </figure>
    </section>

    <p class="gallery-warning">NO SALGAS SOLO. NO RESPONDAS. NO TE DETENGAS.</p>
  </main>
</ion-content>
